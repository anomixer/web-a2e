[package]
name = "applem"
version = "1.7.1"
description = "Apple II Emulator"
authors = ["Mike Daley <michael_daley@icloud.com>"]
edition = "2021"
rust-version = "1.77.2"

# The library is what `main.rs` (desktop) and any mobile entry point call into,
# so the native side of the app lives here once.
[lib]
name = "applem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-localhost = "2"
tauri-plugin-single-instance = "2"

[features]
# This feature is used for production builds or when a dev server is not
# specified. DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
